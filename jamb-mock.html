<header>

    <div class="logo">EduZone 📚</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="jamb.html">JAMB</a>
        <a href="math.html">Math</a>
        <a href="physics.html">Physics</a>
        <a href="chemistry.html">Chemistry</a>
        <a href="biology.html">Biology</a>
        <a href="quiz.html">Quiz</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

<main>

<section class="hero">

    <div class="hero-content">

        <p class="hero-label">🎯 JAMB MOCK EXAM</p>

        <h1>Test Yourself</h1>

        <p class="hero-text">
            Practice Mathematics, Physics, Chemistry and Biology.
        </p>

    </div>

</section>


<section class="lesson">

    <div id="quiz">

        <div id="quizGame">

            <p id="progress"></p>

            <p id="subject"></p>

            <h2 id="question">
                Loading question...
            </h2>

            <div id="answers"></div>

            <p id="feedback"></p>

            <button
                id="nextButton"
                style="display:none;">
                Next Question →
            </button>

        </div>


        <div
            id="finalScore"
            style="display:none; text-align:center;">

            <h2>Mock Exam Complete 🎉</h2>

            <p id="scoreText"></p>

            <br>

            <button onclick="location.reload()">
                Try Again
            </button>

            <br><br>

            <a href="jamb.html">
                <button>
                    Back to JAMB →
                </button>
            </a>

        </div>

    </div>

</section>

</main>


<footer>

    <div class="footer-content">

        <h2>EduZone 📚</h2>

        <p>Learn. Practice. Improve.</p>

        <p class="copyright">
            © 2026 EduZone. All rights reserved.
        </p>

    </div>

</footer>


<script>

const questions = [

    /* =========================
       MATHEMATICS
    ========================= */

    {
        subject: "Mathematics",

        question: "Solve: 2x + 6 = 14",

        answers: [
            "2",
            "4",
            "6",
            "8"
        ],

        correct: 1
    },


    {
        subject: "Mathematics",

        question: "What is 25% of 200?",

        answers: [
            "25",
            "40",
            "50",
            "75"
        ],

        correct: 2
    },


    {
        subject: "Mathematics",

        question: "What is the area of a rectangle with length 8 cm and width 5 cm?",

        answers: [
            "13 cm²",
            "26 cm²",
            "40 cm²",
            "80 cm²"
        ],

        correct: 2
    },


    /* =========================
       PHYSICS
    ========================= */

    {
        subject: "Physics",

        question: "What is the SI unit of force?",

        answers: [
            "Joule",
            "Newton",
            "Watt",
            "Pascal"
        ],

        correct: 1
    },


    {
        subject: "Physics",

        question: "Which quantity is measured in metres per second?",

        answers: [
            "Force",
            "Energy",
            "Speed",
            "Mass"
        ],

        correct: 2
    },


    {
        subject: "Physics",

        question: "Which device is used to measure electric current?",

        answers: [
            "Voltmeter",
            "Ammeter",
            "Thermometer",
            "Barometer"
        ],

        correct: 1
    },


    /* =========================
       CHEMISTRY
    ========================= */

    {
        subject: "Chemistry",

        question: "Which particle has a negative charge?",

        answers: [
            "Proton",
            "Neutron",
            "Electron",
            "Nucleus"
        ],

        correct: 2
    },


    {
        subject: "Chemistry",

        question: "What is the chemical symbol for sodium?",

        answers: [
            "So",
            "Na",
            "S",
            "Sd"
        ],

        correct: 1
    },


    {
        subject: "Chemistry",

        question: "Which of these is an alkane?",

        answers: [
            "Ethene",
            "Ethyne",
            "Ethane",
            "Ethanol"
        ],

        correct: 2
    },


    /* =========================
       BIOLOGY
    ========================= */

    {
        subject: "Biology",

        question: "What is the basic unit of life?",

        answers: [
            "Tissue",
            "Organ",
            "Cell",
            "Organism"
        ],

        correct: 2
    },


    {
        subject: "Biology",

        question: "Which organelle is mainly responsible for photosynthesis?",

        answers: [
            "Mitochondrion",
            "Nucleus",
            "Chloroplast",
            "Ribosome"
        ],

        correct: 2
    },


    {
        subject: "Biology",

        question: "Which molecule carries genetic information?",

        answers: [
            "DNA",
            "Glucose",
            "Water",
            "Starch"
        ],

        correct: 0
    }

];


let currentQuestion = 0;

let score = 0;

let answered = false;


const questionElement =
    document.getElementById("question");

const answersElement =
    document.getElementById("answers");

const feedbackElement =
    document.getElementById("feedback");

const nextButton =
    document.getElementById("nextButton");

const progressElement =
    document.getElementById("progress");

const subjectElement =
    document.getElementById("subject");

const quizGame =
    document.getElementById("quizGame");

const finalScore =
    document.getElementById("finalScore");

const scoreText =
    document.getElementById("scoreText");


function loadQuestion() {

    answered = false;

    feedbackElement.textContent = "";

    nextButton.style.display = "none";


    const current =
        questions[currentQuestion];


    progressElement.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    subjectElement.textContent =
        `📚 ${current.subject}`;


    questionElement.textContent =
        current.question;


    answersElement.innerHTML = "";


    current.answers.forEach(
        (answer, index) => {

            const button =
                document.createElement("button");


            button.textContent =
                `${String.fromCharCode(65 + index)}. ${answer}`;


            button.onclick =
                () => checkAnswer(index);


            answersElement.appendChild(button);

        }
    );

}


function checkAnswer(selected) {

    if (answered) return;

    answered = true;


    const current =
        questions[currentQuestion];


    const buttons =
        answersElement.querySelectorAll("button");


    buttons.forEach(button => {

        button.disabled = true;

    });


    if (selected === current.correct) {

        score++;

        feedbackElement.textContent =
            "✅ Correct!";

    } else {

        feedbackElement.textContent =
            `❌ Incorrect. Correct answer: ${
                current.answers[current.correct]
            }`;

    }


    nextButton.style.display =
        "inline-block";

}


nextButton.onclick = function() {

    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {

        loadQuestion();

    } else {

        finishQuiz();

    }

};


function finishQuiz() {

    quizGame.style.display =
        "none";


    finalScore.style.display =
        "block";


    scoreText.textContent =
        `You scored ${score} out of ${questions.length}.`;


    localStorage.setItem(
        "jambMockScore",
        score
    );

}


loadQuestion();

</script>

</body>

</html>
